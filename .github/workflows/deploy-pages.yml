name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Smoke static HTML (basePath + Explore IA)
        run: |
          test -f out/index.html
          grep -qE '/china-travel-atlas/_next/' out/index.html \
            || (echo 'FAIL: missing /china-travel-atlas/_next in out/index.html' && exit 1)
          grep -qE '探索方式|全部景点|地图选区' out/index.html \
            || (echo 'FAIL: Explore IA tabs/labels missing from static HTML' && exit 1)
          echo 'OK: Pages static smoke (basePath + Explore IA)'

      - name: Pack offline zip
        run: |
          cp docs/离线打开说明.md out/离线打开说明.md
          cp README.md out/README.md
          cd out
          zip -r ../china-travel-atlas-offline.zip .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Upload offline zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-travel-atlas-offline
          path: china-travel-atlas-offline.zip

      - name: Publish offline Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-latest
          name: 离线包（随 main 自动更新）
          body: |
            自动构建的静态离线包，适合信号不好时给父母用。

            1. 下载 `china-travel-atlas-offline.zip`
            2. 解压后按包内「离线打开说明.md」操作
            3. 在线版（若 Pages 已开启）：https://lanking520.github.io/china-travel-atlas/
          files: china-travel-atlas-offline.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
